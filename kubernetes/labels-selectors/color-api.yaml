# ==============================================================================
# THEORY: KUBERNETES LABELS AND SELECTORS (PODS)
# ==============================================================================
# LABELS:
# - Key/value pairs attached to objects (like Pods, Services, Nodes).
# - Used to organize, categorize, and select subsets of Kubernetes objects.
# - Do not provide direct behavior; instead, controllers and services use Selectors
#   to target labeled objects.
#
# SELECTOR TYPES:
# 1. Equality-based Selectors:
#    - `=`, `==` (equal), `!=` (not equal).
#    - Example: `environment=local,tier=backend`
#
# 2. Set-based Selectors:
#    - `in`, `notin`, `exists` (key only).
#    - Example: `tier in (frontend, backend)`, `environment notin (production)`
#
# USEFUL CLI COMMANDS:
# ------------------------------------------------------------------------------
# 1. Apply Pods:
#    kubectl apply -f color-api.yaml
#
# 2. Show all labels attached to Pods:
#    kubectl get pods --show-labels
#
# 3. Display specific labels as custom columns (-L):
#    kubectl get pods -L app,environment,tier
#
# 4. Equality-based Filtering (-l or --selector):
#    kubectl get pods -l app=color-api
#    kubectl get pods -l "app=color-api,tier=backend"
#    kubectl get pods -l "tier!=frontend"
#
# 5. Set-based Filtering:
#    kubectl get pods -l 'tier in (frontend, backend)'
#    kubectl get pods -l 'tier notin (frontend)'
#    kubectl get pods -l 'environment,tier'              # Filter where keys exist
#    kubectl get pods -l '!managed'                     # Filter where key does NOT exist
#
# 6. Imperatively Add, Update, or Remove Labels:
#    kubectl label pod color-backend release=v1.0.0      # Add a new label
#    kubectl label pod color-backend release=v1.1.0 --overwrite # Update existing label
#    kubectl label pod color-backend release-           # Remove label (trailing hyphen)
# ==============================================================================

apiVersion: v1
kind: Pod
metadata:
  name: color-backend
  labels:
    app: color-api
    environment: local
    tier: backend
spec:
  containers:
  - name: color-backend
    image: ultrainstinct21/color-api:1.1.0
    ports:
      - containerPort: 80

---

apiVersion: v1
kind: Pod
metadata:
  name: color-frontend
  labels:
    app: color-api
    environment: local
    tier: frontend
spec:
  containers:
  - name: color-nginx
    image: nginx:latest
    ports:
      - containerPort: 80